[project]
name = "layered-memory"
version = "0.1.1"
description = "Memoria por capas para agentes de IA: captura, destilacion y retrieval con evaluacion reproducible."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mathias Arriagada" }]
keywords = ["rag", "memory", "agents", "retrieval", "embeddings", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "numpy>=2.0",
    "httpx2[http2,brotli,zstd]>=2.13",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
layered-memory = "layered_memory.cli:main"
layered-memory-eval = "layered_memory.eval.run_eval:main"

[project.urls]
Homepage = "https://github.com/AspenQlio/layered-memory"
Source = "https://github.com/AspenQlio/layered-memory"
Issues = "https://github.com/AspenQlio/layered-memory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/layered_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:layered_memory.*",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# B008: Depends()/Query() en defaults es el patron idiomatico de FastAPI.
"src/layered_memory/api/*" = ["B008"]

[tool.coverage.run]
source = ["layered_memory"]
